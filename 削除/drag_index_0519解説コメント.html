<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マイ CSV クリーナー</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        
        /* ドラッグ＆ドロップエリアのスタイル */
        #dropZone {
            border: 3px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background-color: #fafafa;
            color: #666;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        /* ファイルが上に重なったときの色 */
        #dropZone.dragover {
            background-color: #e1f5fe;
            border-color: #03a9f4;
            color: #03a9f4;
        }

        table { border-collapse: collapse; margin-top: 20px; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>CSV クリーナー</h1>
    
    <!-- ドラッグ＆ドロップエリア（クリックしてもファイル選択できます） -->
    <div id="dropZone">
        ここにCSVファイルをドラッグ＆ドロップするか、クリックしてファイルを選択
        <!-- 本体のファイル入力は非表示にして裏で連動させます -->
        <input type="file" id="csvFile" accept=".csv" style="display: none;">
        <!-- <input type="file" ・・ accept=".csv" style="display: none;">  とはinput type="file"よりファイル選択ボタンであり 
        accept=".csv"より拡張子が .csv のファイルだけに制限という指定（フィルター）で  style="display: none;より 見えない隠しボタンである  -->
    </div>

    <!-- 結果を表示する場所 -->
    <div id="tableContainer"></div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const csvFile = document.getElementById('csvFile');

        // エリアをクリックしたら、隠れているファイル選択を開く
        dropZone.addEventListener('click', () => csvFile.click());
		//dropZoneクリックのイベントにcsvFile.click()を登録するという意味、csvFile.click()処理とはid="csvFile"オブジェクト（タグ）をクリックするということ
        // マウスがファイルを乗せた状態でエリアに入ったとき
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();//ブラウザが勝手にファイルをダウンロードするの防ぐ処理、ブラウザはdragoverの時点で次のドロップに備えて準備を始めるのでそれを防ぐ処理
                               //これを書かないと「addEventListener('drop',」（ドラッグドロップ処理）が発生しなくなるとか
            dropZone.classList.add('dragover');//「ファイルがエリアの上に乗った瞬間に、点線のボックスのデザイン（色など）をパッと変える」処理
                                               //仕組:HTMLのパーツ（dropZone）に対して、CSSのクラス名である 'dragover' を一時的に追加（add）している
        });

        // マウスがエリアから離れたとき
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        // ファイルをドロップしたとき
        //addEventListenerの引数eには「ファイルがドロップされた」というイベントの場合、e の中の重要データ
        //どんな操作か: 「ドロップ（drop）」という情報、どこで起きたか: dropZone の上という情報、何がドロップされたかの情報が入っている
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.endsWith('.csv')) {
                processFile(files[0]);
            } else {
                alert('CSVファイルを選択してください。');
            }
        });

        // 普通にボタンからファイルを選択したとき
        //csvFile（ファイル選択の入力欄）で、中身が「変更（change）されたとき(addEventListener('change', (e))」に実行する処理の登録
        // (e には、選ばれたファイルなどの詳細情報が自動的に入る) eにはドロップイベントと同じく、「ファイルが選択された」というイベントの詳細情報がはいる eはeventのe
            csvFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) processFile(file);
        });

        // 【共通処理】ファイルを読み込む関数
        function processFile(file) {
            const reader = new FileReader();//①
            reader.onload = function(event) {//②
                const text = event.target.result;//④
                displayCSV(text); //⑤
            };
            reader.readAsText(file, 'UTF-8'); //③
        }

        // CSVのテキストを分解してテーブルにする関数（ダブルクォーテーション除去付き）
        function displayCSV(text) {
            const lines = text.split('\n');
            let html = '<table>';

            lines.forEach((line, index) => {
                if (line.trim() === '') return; 
                
                const cells = line.split(','); 
                html += '<tr>';
                
                cells.forEach(cell => {
                    // 前後の空白と、邪魔なダブルクォーテーションを自動で削除
                    let cleanCell = cell.trim().replace(/^"|"$/g, ''); 
                    
                    if (index === 0) {
                        html += `<th>${cleanCell}</th>`;
                    } else {
                        html += `<td>${cleanCell}</td>`;
                    }
                });
                
                html += '</tr>';
            });

            html += '</table>';
            document.getElementById('tableContainer').innerHTML = html;
        }
    </script>
</body>
</html>
