<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マイ CSV クリーナー</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">

        <!-- 謳い文句とタイトルを改行して美しく配置 -->
        <span class="catch-copy">インストール不要 ・ 完全無料</span>
        <h1 class="main-title">ブラウザだけで使えるCSV整形ツール <span>CSVスッキリ</span></h1>

        <!-- 【変更】スライド式セグメントコントロール -->
        <div class="top-controls">
            <div class="switch-container">
            <input type="radio" id="modeFile" name="inputMode" value="file" checked>
                <label for="modeFile" class="switch-label">ファイル選択 / コピペ</label>

                <input type="radio" id="modeDirect" name="inputMode" value="direct">
                <label for="modeDirect" class="switch-label">直接テキスト入力</label>

                <!-- 背景で動くスライド用の板 -->
                <div class="switch-selection"></div>
            </div>
    
            <!-- CSV整形実行ボタン（初期状態は非表示） -->
            <button id="convertBtn" class="primary-btn" style="display: none;">表形式へ</button>
        </div>


        <!-- 入力エリアをまとめるコンテナ（スタイル調整用） -->
        <div class="input-wrapper">
            <!-- 【モード1】ファイルドロップ / コピペゾーン -->
            <div id="dropZone" tabindex="0">
                <p class="text-primary">ここにCSVファイルをドラッグ＆ドロップ</p>
                <p class="text-secondary">または クリックしてファイルを選択</p>
                <p class="text-hint">💡 コピペ（Ctrl + V）でテキストを直接貼り付けてもOKです</p>
                <input type="file" id="csvFile" accept=".csv" style="display: none;">
            </div>

            <!-- 【モード2】直接テキスト入力ゾーン（初期状態は非表示） -->
            <div id="directInputZone" style="display: none;">
                <textarea id="csvTextArea" placeholder="ここにCSVテキストを直接入力・編集してください..."></textarea>
            </div>
        </div>

        <!-- CSV整形実行ボタン（初期状態は非表示） 
        <div class="action-container" style="text-align: center; margin: 15px 0;">
            <button id="convertBtn" class="primary-btn" style="display: none;">CSVを整形する</button>
        </div>
        -->

        <!-- ファイル名とキャンセル、コピーボタンを表示するコンテナ -->
        <div class="title-container">
            <div id="fileInfo" style="display: none;"><!--style="display: none;"、ファイル貼付けよりjsで"display: flex"となり表示となる-->
                <span id="fileName"></span>
                <span id="cancelClear" class="cancel-btn">キャンセル</span>
                <button id="copyBtn">CSVをコピー</button>
            </div>
        </div>
        

        <!-- テーブルを表示する場所 -->
        <div id="tableContainer"></div>
    </div>    
    
</body>
</html>
